spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    open-in-view: false
  data:
    web:
      pageable:
        default-page-size: 15
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog-master.xml
    drop-first: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

app:
  storage:
    offer-pdf-dir: ${APP_STORAGE_OFFER_PDF_DIR:./storage/offer-pdfs}
  mail:
    encryption-key: ${APP_MAIL_ENCRYPTION_KEY:}
  google-oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/integrations/google/callback}
    frontend-redirect-uri: ${GOOGLE_OAUTH_FRONTEND_REDIRECT_URI:http://localhost:4200/settings}
